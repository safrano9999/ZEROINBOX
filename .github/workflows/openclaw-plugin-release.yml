name: OpenClaw plugin

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "20*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_DIR: openclaw-plugin
  ZIP_NAME: zeroinbox-openclaw-plugin.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check plugin sources
        run: bash "$PLUGIN_DIR/scripts/check.sh"

      - name: Build plugin archive
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256"
          (
            cd "$PLUGIN_DIR"
            zip -qr "../dist/$ZIP_NAME" . \
              -x ".env" ".env.*" ".calenv" ".gmail-oauth-client.json" ".gmail-token*.json" \
              -x "*.sqlite3" "*.pyc" "*/__pycache__/*" \
              -x ".venv/*" ".venv/**" "*/.venv/*" "*/.venv/**" \
              -x "node_modules/*" "node_modules/**" "*/node_modules/*" "*/node_modules/**" \
              -x "logs/*" "logs/**" "LOGS/*" "LOGS/**" "state/*" "state/**" "REPORTS/*" "REPORTS/**"
          )
          (cd dist && sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256")

      - name: Inspect archive
        run: |
          set -euo pipefail
          zipinfo -1 "dist/$ZIP_NAME" | tee /tmp/archive-files.txt
          if grep -E '(^|/)(\.env|\.calenv|\.gmail-oauth-client\.json|\.gmail-token.*\.json|\.venv|node_modules|__pycache__|logs|LOGS|state|REPORTS)(/|$)|(\.pyc|\.sqlite3)$' /tmp/archive-files.txt; then
            echo "Refusing to publish archive with generated state, secrets, cache, or database files." >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroinbox-openclaw-plugin
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.ZIP_NAME }}.sha256

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --clobber
          else
            gh release create "$tag" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" \
              --title "$tag" \
              --notes "OpenClaw plugin archive for ZEROINBOX."
          fi

      - name: Publish latest alias
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="latest"
          git tag -f "$latest_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$latest_tag" --force
          notes="Latest OpenClaw plugin archive for ZEROINBOX. Current source tag: ${GITHUB_REF_NAME}."
          if gh release view "$latest_tag" >/dev/null 2>&1; then
            gh release upload "$latest_tag" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --clobber
            gh release edit "$latest_tag" --title "$latest_tag" --notes "$notes"
          else
            gh release create "$latest_tag" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" \
              --target "$GITHUB_SHA" \
              --title "$latest_tag" \
              --notes "$notes"
          fi
