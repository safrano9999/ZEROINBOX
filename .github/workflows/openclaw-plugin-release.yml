name: OpenClaw plugin

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "20*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIP_NAME: zeroinbox-latest.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check plugin sources
        run: bash scripts/check.sh

      - name: Build plugin archive
        run: |
          set -euo pipefail
          rm -f "$ZIP_NAME" "$ZIP_NAME.sha256"
          zip -qr "$ZIP_NAME" \
            README.md provider.conf ZEROINBOX_init.sh openclaw.plugin.json package.json requirements.txt \
            index.js scripts skills zeroinbox
          for optional in env.example config.conf_example; do
            [ -f "$optional" ] && zip -q "$ZIP_NAME" "$optional"
          done
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"

      - name: Inspect archive
        run: |
          set -euo pipefail
          zipinfo -1 "$ZIP_NAME" | tee /tmp/archive-files.txt
          if grep -E '(^|/)(tag\.sh|\.env|\.calenv|\.gmail-oauth-client\.json|\.gmail-token.*\.json|\.venv|node_modules|__pycache__|logs|LOGS|state|REPORTS)(/|$)|(\.pyc|\.sqlite3)$' /tmp/archive-files.txt; then
            echo "Refusing to publish archive with generated state, secrets, cache, or database files." >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroinbox-latest
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
          else
            gh release create "$tag" "$ZIP_NAME" "$ZIP_NAME.sha256" \
              --title "$tag" \
              --notes "OpenClaw plugin archive for ZEROINBOX."
          fi

      - name: Publish latest alias
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="latest"
          notes="Latest OpenClaw plugin archive for ZEROINBOX. Current source tag: ${GITHUB_REF_NAME}."
          if gh release view "$latest_tag" >/dev/null 2>&1; then
            gh release upload "$latest_tag" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
            gh release edit "$latest_tag" --title "$latest_tag" --notes "$notes"
          else
            for attempt in 1 2 3; do
              if gh release create "$latest_tag" "$ZIP_NAME" "$ZIP_NAME.sha256" \
                --target "$GITHUB_SHA" \
                --title "$latest_tag" \
                --notes "$notes"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
