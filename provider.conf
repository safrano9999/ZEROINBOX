# provider.conf - static built-in ZEROINBOX provider defaults.
# config.conf selects a provider per account. Custom providers stay local in
# config.conf as ZEROINBOX_PROVIDER_<NAME>_* values.

[provider.gmail]
host=imap.gmail.com
port=993
inbox=INBOX
search=UNSEEN
archive_prefix=INBOX/Archiv
password_label=Gmail App Password
password_env_suffix=APP_PASSWORD
create_missing_folders=true
expunge_after_move=true

[provider.icloud]
host=imap.mail.me.com
port=993
inbox=INBOX
search=UNSEEN
archive_prefix=ZEROINBOX/Archiv
password_label=iCloud app-specific password
password_env_suffix=APP_PASSWORD
create_missing_folders=true
expunge_after_move=true
